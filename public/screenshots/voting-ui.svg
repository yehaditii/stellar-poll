<svg width="600" height="700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #f9fafb; }
      .header { fill: #4f46e5; }
      .title { font-size: 24px; font-weight: bold; fill: white; }
      .question { font-size: 20px; fill: #1f2937; font-weight: 600; }
      .option-box { fill: white; stroke: #e5e7eb; stroke-width: 2; rx: 8; }
      .option-text { font-size: 16px; fill: #1f2937; font-weight: 600; }
      .button { fill: #4f46e5; }
      .button-text { font-size: 16px; fill: white; font-weight: 600; }
      .address { font-size: 12px; fill: #6b7280; font-family: monospace; }
      .status { font-size: 13px; fill: #10b981; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect class="bg" width="600" height="700"/>
  
  <!-- Header -->
  <rect class="header" width="600" height="70"/>
  <text class="title" x="20" y="45">StellarPoll</text>
  <text class="address" x="20" y="65">Connected: GDY5G3PQFH...XJH7PYQWE</text>
  
  <!-- Question -->
  <text class="question" x="40" y="120">Which blockchain is most promising?</text>
  
  <!-- Option 1: Stellar -->
  <rect class="option-box" x="40" y="150" width="520" height="100"/>
  <text class="option-text" x="60" y="190">Stellar</text>
  <text class="status" x="60" y="215">Votes: 8 (32%)</text>
  <rect x="60" y="230" width="156" height="8" fill="#10b981" rx="4"/>
  <rect x="216" y="230" width="344" height="8" fill="#e5e7eb" rx="4"/>
  
  <!-- Option 2: Ethereum -->
  <rect class="option-box" x="40" y="270" width="520" height="100"/>
  <text class="option-text" x="60" y="310">Ethereum</text>
  <text class="status" x="60" y="335">Votes: 12 (48%)</text>
  <rect x="60" y="350" width="240" height="8" fill="#4f46e5" rx="4"/>
  <rect x="300" y="350" width="260" height="8" fill="#e5e7eb" rx="4"/>
  
  <!-- Option 3: Solana -->
  <rect class="option-box" x="40" y="390" width="520" height="100"/>
  <text class="option-text" x="60" y="430">Solana</text>
  <text class="status" x="60" y="455">Votes: 5 (20%)</text>
  <rect x="60" y="470" width="100" height="8" fill="#f97316" rx="4"/>
  <rect x="160" y="470" width="400" height="8" fill="#e5e7eb" rx="4"/>
  
  <!-- Cast Vote Button -->
  <rect class="button" x="120" y="540" width="360" height="50" rx="8"/>
  <text class="button-text" x="300" y="572" text-anchor="middle">Cast Vote On-Chain</text>
  
  <!-- Status -->
  <text class="status" x="40" y="640">Status: Ready to vote</text>
  <text class="address" x="40" y="680">Real-time updates enabled (5-second polling)</text>
</svg>